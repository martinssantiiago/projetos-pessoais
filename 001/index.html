<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <main>
        <section id="Login">
            <div class="form">
                <h1>Login</h1>
               <form action="cadastro.php">
                 <div class="campo">
                     <label for="iemail">Email:</label>
                     <input type="email" name="email" id="iemail" required autocomplete="email" maxlength="30" placeholder="coloque seu e-mail"> 
                 </div>

                 <div class="campo">
                     <label for="isenha">Senha:</label>
                     <input type="password" name="senha" id="isenha" required autocomplete="current-password" minlength="8" maxlength="20" placeholder="coloque sua senha">
                 </div>

                 <div class="esqueci">
                     <input type="submit" value="entrar">
                     <a href="#">Esquecia a senha</a>
                 </div>
               </form>
            </div>
        </section>
    </main>
</body>
</html>
